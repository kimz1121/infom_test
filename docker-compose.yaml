name: infom_test
services:
  infom:
    container_name: infom_test
    build:
      context: ./docker
      dockerfile: dockerfile
      args:
        USERNAME: iw
        USER_UID: "1000"
        USER_GID: "1000"
    image: infom_test:latest
    runtime: nvidia
    user: "1000:1000"
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      # HuggingFace 다운로드 시 인증이 필요하면 아래 주석 해제 후 토큰 입력
      # - HUGGING_FACE_HUB_TOKEN=hf_xxxxxxxxxxxxxxxxxxxx
      # Mujoco 관련 환경변수
      - MUJOCO_GL=egl
      - PYOPENGL_PLATFORM=egl
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      # 소스 코드 마운트 (실시간 개발용)
      - ${HOME}/code/infom:/home/${USERNAME}/infom
      - ${HOME}/.cache/huggingface:/home/${USERNAME}/.cache/huggingface
      - ${HOME}/.cache/torch:/home/${USERNAME}/.cache/torch
    working_dir: /workspace
    shm_size: "8gb"
    stdin_open: true
    tty: true
    command: /bin/bash