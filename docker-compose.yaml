name: infom_test
services:
  infom:
    container_name: infom_test
    build:
      context: ./docker
      dockerfile: dockerfile
      args:
        USERNAME: ${USERNAME}
        USER_UID: ${USER_UID}
        USER_GID: ${USER_GID}
    image: infom_test:latest
    user: "${USER_UID}:${USER_GID}"
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      # HuggingFace 다운로드 시 인증이 필요하면 아래 주석 해제 후 토큰 입력
      # - HUGGING_FACE_HUB_TOKEN=hf_xxxxxxxxxxxxxxxxxxxx
      # Mujoco 관련 환경변수
      - MUJOCO_GL=egl
      - PYOPENGL_PLATFORM=egl
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      # 소스 코드 마운트 (실시간 개발용)
      - type: bind
        source: ${HOME}/code/infom
        target: /home/${USERNAME}/infom
        bind:
          create_host_path: false   # 호스트 경로 없으면 실패
      - type: bind
        source: ${HOME}/.cache/huggingface
        target: /home/${USERNAME}/.cache/huggingface
        bind:
          create_host_path: false
      - type: bind
        source: ${HOME}/.cache/torch
        target: /home/${USERNAME}/.cache/torch
        bind:
          create_host_path: false
    working_dir: /home/${USERNAME}
    shm_size: "8gb"
    stdin_open: true
    tty: true
    command: /bin/bash